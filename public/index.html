<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Desenho Assinado</h1>
      <p>
        Escolha um número entre 1 e 100.
        Sua figura será assinada com o e-mail
        verificado da sua conta Google.
      </p>
    </header>

    <section aria-labelledby="titulo-login">
      <h2 id="titulo-login">Entre com o Google</h2>
      <div id="google-login"></div>
      <p id="status-login" role="status">
        Faça login para desenhar.
      </p>
    </section>

    <form id="formulario" novalidate>
      <label for="numero">Número</label>
      <input
        id="numero"
        name="numero"
        type="number"
        min="1"
        max="100"
        step="1"
        required
        placeholder="42"
      >
      <button type="submit">Desenhar</button>
    </form>

    <p id="mensagem" role="alert" aria-live="polite"></p>

    <figure id="desenho" aria-live="polite"></figure>

    <button id="baixar" type="button" hidden>
      Baixar SVG
    </button>
  </main>

  <script type="module" src="/script.js"></script>
</body>
</html>
